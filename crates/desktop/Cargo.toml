[package]
name = "hpharness-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust workspace for the Cordis agent harness"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "=0.33.3", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
png = "0.18"
portable-pty = "0.9"
vt100 = "0.15"
percent-encoding = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
